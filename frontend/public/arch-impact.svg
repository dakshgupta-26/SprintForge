<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 115" width="100%" height="100%">
  <defs>
    <marker id="arr-i-purple" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#A855F7" />
    </marker>
  </defs>

  <rect width="1000" height="115" fill="#080B14" />

  <g transform="translate(20, 15)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="960" height="85" rx="6" fill="#0A0E1A" stroke="#3B0764" stroke-width="1" />
    <text x="14" y="16" fill="#D8B4FE" font-size="10" font-weight="700" letter-spacing="0.4">IMPACT ENGINE PIPELINE — Deterministic Discrete Graph Algorithms</text>

    <!-- 6 Horizontally Chained Algorithmic Nodes -->
    <g transform="translate(14, 25)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="138" height="46" rx="4" fill="#140E26" stroke="#7C3AED" stroke-width="0.8" />
      <text x="8" y="17" fill="#FFFFFF" font-size="10" font-weight="600">1. Dependencies</text>
      <text x="8" y="32" fill="#D8B4FE" font-size="8">Task Adjacency Matrix</text>

      <!-- Arrow 1-2 -->
      <path d="M 138 23 L 157 23" stroke="#A855F7" stroke-width="1.3" marker-end="url(#arr-i-purple)" />

      <!-- Step 2 -->
      <rect x="159" y="0" width="138" height="46" rx="4" fill="#140E26" stroke="#7C3AED" stroke-width="0.8" />
      <text x="8" y="17" fill="#FFFFFF" font-size="10" font-weight="600">2. DAG Construction</text>
      <text x="8" y="32" fill="#D8B4FE" font-size="8">Directed Acyclic Graph</text>

      <!-- Arrow 2-3 -->
      <path d="M 297 23 L 316 23" stroke="#A855F7" stroke-width="1.3" marker-end="url(#arr-i-purple)" />

      <!-- Step 3 -->
      <rect x="318" y="0" width="138" height="46" rx="4" fill="#140E26" stroke="#7C3AED" stroke-width="0.8" />
      <text x="8" y="17" fill="#FFFFFF" font-size="10" font-weight="600">3. Cycle Detection</text>
      <text x="8" y="32" fill="#D8B4FE" font-size="8">Kahn's &amp; DFS O(V+E)</text>

      <!-- Arrow 3-4 -->
      <path d="M 456 23 L 475 23" stroke="#A855F7" stroke-width="1.3" marker-end="url(#arr-i-purple)" />

      <!-- Step 4 -->
      <rect x="477" y="0" width="138" height="46" rx="4" fill="#140E26" stroke="#7C3AED" stroke-width="0.8" />
      <text x="8" y="17" fill="#FFFFFF" font-size="10" font-weight="600">4. Critical Path</text>
      <text x="8" y="32" fill="#D8B4FE" font-size="8">CPM Pass (Float &lt;= 0)</text>

      <!-- Arrow 4-5 -->
      <path d="M 615 23 L 634 23" stroke="#A855F7" stroke-width="1.3" marker-end="url(#arr-i-purple)" />

      <!-- Step 5 -->
      <rect x="636" y="0" width="138" height="46" rx="4" fill="#140E26" stroke="#7C3AED" stroke-width="0.8" />
      <text x="8" y="17" fill="#FFFFFF" font-size="10" font-weight="600">5. Risk Radar</text>
      <text x="8" y="32" fill="#D8B4FE" font-size="8">6-Vector Score (0-100)</text>

      <!-- Arrow 5-6 -->
      <path d="M 774 23 L 793 23" stroke="#A855F7" stroke-width="1.3" marker-end="url(#arr-i-purple)" />

      <!-- Step 6 -->
      <rect x="795" y="0" width="137" height="46" rx="4" fill="#140E26" stroke="#7C3AED" stroke-width="0.8" />
      <text x="8" y="17" fill="#FFFFFF" font-size="10" font-weight="600">6. What-If Sandbox</text>
      <text x="8" y="32" fill="#D8B4FE" font-size="8">In-Memory Graph Clone</text>
    </g>
  </g>
</svg>