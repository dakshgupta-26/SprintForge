<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 215" width="100%" height="100%">
  <defs>
    <marker id="arr-a-amber" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-a-blue" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-a-green" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="1000" height="215" fill="#080B14" />

  <g transform="translate(20, 15)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- LEFT BOX: DUAL AUTHENTICATION INGRESS (Width: 680) -->
    <rect width="680" height="185" rx="6" fill="#0A0E1A" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="16" fill="#E2E8F0" font-size="10" font-weight="700" letter-spacing="0.4">AUTHENTICATION INGRESS PIPELINE</text>

    <!-- Path A: Email / OTP -->
    <g transform="translate(14, 25)">
      <rect width="652" height="66" rx="4" fill="#140E0A" stroke="#B45309" stroke-width="0.8" />
      <text x="10" y="14" fill="#FDE68A" font-size="9" font-weight="700">Path A: Email / OTP Challenge</text>

      <g transform="translate(10, 20)">
        <rect x="0" y="0" width="138" height="36" rx="3" fill="#0F172A" stroke="#D97706" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">1. Email Input</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">User Submits Email</text>

        <path d="M 138 18 L 157 18" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-a-amber)" />

        <rect x="159" y="0" width="138" height="36" rx="3" fill="#0F172A" stroke="#D97706" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">2. OTP Generator</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">Crypto 6-Digit Hash</text>

        <path d="M 297 18 L 316 18" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-a-amber)" />

        <rect x="318" y="0" width="138" height="36" rx="3" fill="#0F172A" stroke="#D97706" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">3. SMTP Dispatch</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">Mailjet / Resend SDK</text>

        <path d="M 456 18 L 475 18" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-a-amber)" />

        <rect x="477" y="0" width="155" height="36" rx="3" fill="#0F172A" stroke="#D97706" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">4. Verify Challenge</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">Check Challenge Record</text>
      </g>
    </g>

    <!-- Path B: Google OAuth 2.0 PKCE -->
    <g transform="translate(14, 101)">
      <rect width="652" height="66" rx="4" fill="#081426" stroke="#1D4ED8" stroke-width="0.8" />
      <text x="10" y="14" fill="#BFDBFE" font-size="9" font-weight="700">Path B: Google OAuth 2.0 PKCE Federated Flow</text>

      <g transform="translate(10, 20)">
        <rect x="0" y="0" width="138" height="36" rx="3" fill="#0F172A" stroke="#2563EB" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">1. Google Sign-In</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">One-Tap Browser UI</text>

        <path d="M 138 18 L 157 18" stroke="#3B82F6" stroke-width="1.2" marker-end="url(#arr-a-blue)" />

        <rect x="159" y="0" width="138" height="36" rx="3" fill="#0F172A" stroke="#2563EB" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">2. ID Token</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">PKCE Token Exchange</text>

        <path d="M 297 18 L 316 18" stroke="#3B82F6" stroke-width="1.2" marker-end="url(#arr-a-blue)" />

        <rect x="318" y="0" width="138" height="36" rx="3" fill="#0F172A" stroke="#2563EB" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">3. Verification</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">google-auth-library</text>

        <path d="M 456 18 L 475 18" stroke="#3B82F6" stroke-width="1.2" marker-end="url(#arr-a-blue)" />

        <rect x="477" y="0" width="155" height="36" rx="3" fill="#0F172A" stroke="#2563EB" stroke-width="0.7" />
        <text x="6" y="14" fill="#FFFFFF" font-size="9" font-weight="600">4. User Provision</text>
        <text x="6" y="26" fill="#94A3B8" font-size="7.5">Match or Create Record</text>
      </g>
    </g>

    <!-- Convergence Arrows into Right Gate -->
    <path d="M 680 68 L 718 68 L 718 92 L 733 92" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-a-green)" />
    <path d="M 680 144 L 718 144 L 718 102 L 733 102" stroke="#10B981" stroke-width="1.3" marker-end="url(#arr-a-green)" />

    <!-- RIGHT BOX: SESSION & RBAC GATE (Width: 240) -->
    <g transform="translate(740, 0)">
      <rect width="220" height="185" rx="6" fill="#061B14" stroke="#059669" stroke-width="1" />
      <text x="12" y="18" fill="#6EE7B7" font-size="10" font-weight="700" letter-spacing="0.4">SESSION &amp; RBAC GATE</text>

      <g transform="translate(10, 30)">
        <rect x="0" y="0" width="200" height="30" rx="3" fill="#0A281E" stroke="#10B981" stroke-width="0.7" />
        <text x="8" y="14" fill="#FFFFFF" font-size="9" font-weight="600">HTTP-Only JWT Cookie</text>
        <text x="8" y="24" fill="#A7F3D0" font-size="7.5">Secure Session with Rotation</text>

        <rect x="0" y="38" width="200" height="42" rx="3" fill="#0A281E" stroke="#10B981" stroke-width="0.7" />
        <text x="8" y="14" fill="#FFFFFF" font-size="9" font-weight="600">5-Tier RBAC Access Gate</text>
        <text x="8" y="26" fill="#A7F3D0" font-size="7.5">Admin &gt; Lead &gt; Dev &gt; QA &gt; Viewer</text>
        <text x="8" y="36" fill="#6EE7B7" font-size="7">Enforced via Express Middleware</text>

        <rect x="0" y="88" width="200" height="42" rx="3" fill="#0A281E" stroke="#10B981" stroke-width="0.7" />
        <text x="8" y="14" fill="#FFFFFF" font-size="9" font-weight="600">Security Audit &amp; Cipher</text>
        <text x="8" y="26" fill="#A7F3D0" font-size="7.5">AES-256-CBC Field Encryption</text>
        <text x="8" y="36" fill="#6EE7B7" font-size="7">SecurityLog.ts Throttle &amp; Audit</text>
      </g>
    </g>
  </g>
</svg>