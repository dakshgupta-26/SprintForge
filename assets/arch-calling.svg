<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 205" width="100%" height="100%">
  <defs>
    <marker id="arr-c-cyan" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-c-pink" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#EC4899" />
    </marker>
  </defs>

  <rect width="1000" height="205" fill="#080B14" />

  <!-- PLANE 1: SIGNALING PLANE -->
  <g transform="translate(20, 15)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="960" height="80" rx="6" fill="#0A0E1A" stroke="#0E3A4A" stroke-width="1" />
    <text x="14" y="16" fill="#67E8F9" font-size="10" font-weight="700" letter-spacing="0.4">SIGNALING PLANE — Socket.IO Server Relay (SDP Offer / Answer &amp; ICE Candidate Exchange)</text>

    <g transform="translate(14, 25)">
      <!-- Client A -->
      <rect x="0" y="0" width="220" height="42" rx="4" fill="#081A24" stroke="#0284C7" stroke-width="0.8" />
      <text x="10" y="16" fill="#FFFFFF" font-size="10.5" font-weight="600">Client A (Caller)</text>
      <text x="10" y="30" fill="#7DD3FC" font-size="8.5">Local SDP Offer &amp; ICE Queue</text>

      <!-- Connector A to Server -->
      <path d="M 220 21 L 340 21" stroke="#06B6D4" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-c-cyan)" marker-start="url(#arr-c-cyan)" />
      <text x="235" y="15" fill="#67E8F9" font-size="7.5" font-weight="600">SDP / ICE Relay</text>

      <!-- Server Bridge -->
      <rect x="345" y="0" width="242" height="42" rx="4" fill="#081A24" stroke="#0284C7" stroke-width="0.8" />
      <text x="10" y="16" fill="#FFFFFF" font-size="10.5" font-weight="600">Socket.IO Signaling Bridge</text>
      <text x="10" y="30" fill="#7DD3FC" font-size="8.5">Express Server / Room Router</text>

      <!-- Connector Server to B -->
      <path d="M 587 21 L 707 21" stroke="#06B6D4" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arr-c-cyan)" marker-start="url(#arr-c-cyan)" />
      <text x="602" y="15" fill="#67E8F9" font-size="7.5" font-weight="600">SDP / ICE Relay</text>

      <!-- Client B -->
      <rect x="712" y="0" width="220" height="42" rx="4" fill="#081A24" stroke="#0284C7" stroke-width="0.8" />
      <text x="10" y="16" fill="#FFFFFF" font-size="10.5" font-weight="600">Client B (Callee)</text>
      <text x="10" y="30" fill="#7DD3FC" font-size="8.5">Remote SDP Answer &amp; ICE Candidate</text>
    </g>
  </g>

  <!-- PLANE 2: MEDIA PLANE -->
  <g transform="translate(20, 105)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="960" height="85" rx="6" fill="#0A0E1A" stroke="#4C0519" stroke-width="1" />
    <text x="14" y="16" fill="#F472B6" font-size="10" font-weight="700" letter-spacing="0.4">MEDIA PLANE — Direct Peer-to-Peer WebRTC (Full-Duplex SRTP Audio &amp; Video Stream)</text>

    <g transform="translate(14, 25)">
      <!-- Client A Media -->
      <rect x="0" y="0" width="260" height="44" rx="4" fill="#1C091A" stroke="#BE185D" stroke-width="0.8" />
      <text x="10" y="17" fill="#FFFFFF" font-size="10.5" font-weight="600">Client A Media Engine</text>
      <text x="10" y="32" fill="#FBCFE8" font-size="8.5">Local Audio / Video Capture (SRTP)</text>

      <!-- Direct P2P Channel -->
      <path d="M 260 22 L 668 22" stroke="#EC4899" stroke-width="2.2" marker-end="url(#arr-c-pink)" marker-start="url(#arr-c-pink)" />
      <rect x="360" y="11" width="210" height="22" rx="3" fill="#0A0E1A" stroke="#BE185D" stroke-width="0.8" />
      <text x="370" y="26" fill="#F472B6" font-size="8.5" font-weight="700">Direct P2P Media Stream (0 Server Relay)</text>

      <!-- Client B Media -->
      <rect x="672" y="0" width="260" height="44" rx="4" fill="#1C091A" stroke="#BE185D" stroke-width="0.8" />
      <text x="10" y="17" fill="#FFFFFF" font-size="10.5" font-weight="600">Client B Media Engine</text>
      <text x="10" y="32" fill="#FBCFE8" font-size="8.5">Remote Audio / Video Render (SRTP)</text>
    </g>
  </g>
</svg>