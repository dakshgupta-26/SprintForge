<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="50%" stop-color="#0B0F1C" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Card Base Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0C101D" stop-opacity="0.85" />
    </linearGradient>

    <!-- Brand Border Gradients -->
    <linearGradient id="b-next" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-react" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-express" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-webrtc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-socket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-mongo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="b-docker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496ED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="card-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="280" rx="14" fill="url(#grid-bg)" stroke="#1E293B" stroke-width="1" />
  <rect width="960" height="280" rx="14" fill="url(#card-dots)" />

  <!-- ============================================================ -->
  <!-- ROW 1 (Y: 20)                                               -->
  <!-- ============================================================ -->

  <!-- CARD 1: Next.js 16 (X: 20, Y: 20) -->
  <g transform="translate(20, 20)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-next)" stroke-width="1.2" />
    <!-- Ambient badge glow -->
    <circle cx="36" cy="40" r="16" fill="#FFFFFF" fill-opacity="0.05" />
    <!-- Official Next.js Logo -->
    <g transform="translate(22, 26)">
      <circle cx="14" cy="14" r="14" fill="#000000" stroke="#334155" stroke-width="0.8" />
      <path fill="#FFFFFF" d="M18.8 21.2 L10.5 10.4 H8.6 V17.6 H10.1 V12.1 L17.5 21.7 C17.9 21.5 18.4 21.4 18.8 21.2 Z" />
      <rect x="17.1" y="10.4" width="1.5" height="7.2" fill="#FFFFFF" />
    </g>
    <text x="60" y="38" fill="#FFFFFF" font-size="13.5" font-weight="700">Next.js 16</text>
    <text x="60" y="52" fill="#94A3B8" font-size="10.5">App Router + Turbopack</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#38BDF8" font-size="9" font-weight="600">⚡ SSR &amp; Concurrent Streaming</text>
  </g>

