      <circle cx="14" cy="14" r="14" fill="#1E112A" stroke="#F43F5E" stroke-width="0.8" />
      <circle cx="8" cy="14" r="3.5" fill="#38BDF8" />
      <circle cx="20" cy="9" r="3.5" fill="#10B981" />
      <circle cx="20" cy="19" r="3.5" fill="#F43F5E" />
