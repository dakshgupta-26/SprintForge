  <g transform="translate(255, 20)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-ts)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#3178C6" fill-opacity="0.1" />
    <!-- Official TypeScript Logo -->
    <g transform="translate(22, 26)">
