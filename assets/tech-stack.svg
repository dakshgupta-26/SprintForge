  <g transform="translate(255, 145)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-socket)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#A855F7" fill-opacity="0.1" />
    <!-- Official Socket.IO Logo Vector -->
    <g transform="translate(22, 26)">
      <circle cx="14" cy="14" r="14" fill="#010101" stroke="#334155" stroke-width="0.8" />
      <path fill="#FFFFFF" d="M14 4.5 C8.8 4.5 4.5 8.8 4.5 14 C4.5 19.2 8.8 23.5 14 23.5 C19.2 23.5 23.5 19.2 23.5 14 C23.5 8.8 19.2 4.5 14 4.5 Z M14 21.2 C10 21.2 6.8 18 6.8 14 C6.8 10 10 6.8 14 6.8 C18 6.8 21.2 10 21.2 14 C21.2 18 18 21.2 14 21.2 Z" />
      <path fill="#00D2FF" d="M12.2 8.8 L8.5 15.2 H13.5 L12 19.2 L19.5 12.8 H14.5 Z" />
    </g>
    <text x="60" y="38" fill="#FFFFFF" font-size="13.5" font-weight="700">Socket.IO 4</text>
    <text x="60" y="52" fill="#94A3B8" font-size="10.5">Duplex Signaling Mesh</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#C084FC" font-size="9" font-weight="600">⚡ Sub-50ms Real-Time Sync</text>
  </g>

  <!-- CARD 7: MongoDB 7 (X: 490, Y: 145) -->
  <g transform="translate(490, 145)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-mongo)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#10B981" fill-opacity="0.1" />
    <!-- Official MongoDB Leaf Logo -->
    <g transform="translate(22, 26)">
      <circle cx="14" cy="14" r="14" fill="#0B261D" stroke="#059669" stroke-width="0.8" />
      <path fill="#47A248" d="M13.9 3.5 C13.5 4.5 11.2 9.5 11.2 13.8 C11.2 17.5 13 19.8 13.9 24.5 C14.8 19.8 16.6 17.5 16.6 13.8 C16.6 9.5 14.3 4.5 13.9 3.5 Z" />
      <path fill="#499D4A" d="M13.9 24.5 C13.8 24.5 13.8 24.4 13.8 24.2 C13.7 20.8 12.8 19.3 11.4 16.6 C10.6 15 9.8 13.3 9.8 11.3 C9.8 7.3 12.3 4.3 13.9 3.5 L13.9 24.5 Z" fill-opacity="0.3" />
    </g>
    <text x="60" y="38" fill="#FFFFFF" font-size="13.5" font-weight="700">MongoDB 7</text>
    <text x="60" y="52" fill="#94A3B8" font-size="10.5">Document Database</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#34D399" font-size="9" font-weight="600">🍃 Compound Indexed Store</text>
  </g>

  <!-- CARD 8: Docker (X: 725, Y: 145) -->
  <g transform="translate(725, 145)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-docker)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#2496ED" fill-opacity="0.1" />
    <!-- Official Docker Whale Logo -->
    <g transform="translate(22, 26)">
      <circle cx="14" cy="14" r="14" fill="#0E2238" stroke="#1D4ED8" stroke-width="0.8" />
      <!-- Containers -->
      <rect x="7" y="10" width="3" height="2.5" fill="#2496ED" rx="0.3" />
      <rect x="11" y="10" width="3" height="2.5" fill="#2496ED" rx="0.3" />
      <rect x="15" y="10" width="3" height="2.5" fill="#2496ED" rx="0.3" />
      <rect x="11" y="7" width="3" height="2.5" fill="#2496ED" rx="0.3" />
      <rect x="15" y="7" width="3" height="2.5" fill="#2496ED" rx="0.3" />
      <!-- Whale Body -->
      <path d="M 5 14 C 5 13.5 6 13 8 13 H 20 C 23 13 24 16 22 18 C 19 20 8 20 5 17 Z" fill="#2496ED" />
      <circle cx="21" cy="15" r="0.7" fill="#FFFFFF" />
    </g>
    <text x="60" y="38" fill="#FFFFFF" font-size="13.5" font-weight="700">Docker</text>
    <text x="60" y="52" fill="#94A3B8" font-size="10.5">Multi-Stage Containers</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#60A5FA" font-size="9" font-weight="600">🐳 Isolated Multi-Tier Stack</text>
  </g>
</svg>