      <path fill="#FFFFFF" d="M13.2 12.8 H9.6 V23.2 H6.8 V12.8 H3.2 V10.5 H13.2 V12.8 Z M22.8 19.8 C22.8 20.9 22.4 21.8 21.6 22.4 C20.8 23 19.7 23.3 18.3 23.3 C17 23.3 15.9 23 15 22.3 C14.1 21.6 13.5 20.7 13.3 19.5 L16.1 18.4 C16.2 19 16.5 19.6 17 20 C17.4 20.3 18 20.5 18.6 20.5 C19.1 20.5 19.5 20.4 19.8 20.2 C20.1 20 20.2 19.7 20.2 19.3 C20.2 19 20.1 18.7 19.8 18.5 C19.5 18.3 18.9 18 18.1 17.7 L16.9 17.3 C15.6 16.8 14.7 16.3 14.1 15.6 C13.5 14.9 13.2 14 13.2 13 C13.2 12 13.6 11.2 14.4 10.6 C15.2 10 16.3 9.7 17.7 9.7 C18.8 9.7 19.8 10 20.6 10.5 C21.4 11 21.9 11.7 22.2 12.6 L19.5 13.7 C19.3 13.2 19.1 12.9 18.7 12.7 C18.3 12.5 17.9 12.4 17.4 12.4 C16.9 12.4 16.6 12.5 16.3 12.7 C16 12.9 15.9 13.1 15.9 13.4 C15.9 13.7 16 13.9 16.3 14.1 C16.6 14.3 17.1 14.5 17.8 14.8 L19 15.2 C20.4 15.7 21.4 16.3 22 17 C22.5 17.8 22.8 18.7 22.8 19.8 Z" transform="scale(0.85) translate(2, 2)" />
    </g>
    <text x="60" y="38" fill="#FFFFFF" font-size="13.5" font-weight="700">TypeScript 5</text>
    <text x="60" y="52" fill="#94A3B8" font-size="10.5">Strict Type System</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#60A5FA" font-size="9" font-weight="600">🛡️ Compile-Time Domain Safety</text>
  </g>

  <!-- CARD 3: React 19 (X: 490, Y: 20) -->
  <g transform="translate(490, 20)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-react)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#61DAFB" fill-opacity="0.1" />
