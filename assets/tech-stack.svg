      <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(0 14 14)" />
      <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(60 14 14)" />
      <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(120 14 14)" />
