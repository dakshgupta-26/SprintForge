    <text x="60" y="52" fill="#94A3B8" font-size="10.5">Modern Component UI</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#38BDF8" font-size="9" font-weight="600">⚛️ Server Actions &amp; Hooks</text>
  </g>

  <!-- CARD 4: Express.js 4 (X: 725, Y: 20) -->
  <g transform="translate(725, 20)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-express)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#FCD34D" fill-opacity="0.1" />
    <!-- Official Node/Express Logo Mark -->
    <g transform="translate(22, 26)">
      <rect width="28" height="28" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
      <text x="5" y="19" fill="#F4F4F5" font-size="12" font-weight="800" font-family="monospace">ex</text>
    </g>
    <text x="60" y="38" fill="#FFFFFF" font-size="13.5" font-weight="700">Express.js 4</text>
    <text x="60" y="52" fill="#94A3B8" font-size="10.5">REST API Architecture</text>
    <rect x="22" y="74" width="171" height="20" rx="4" fill="#0F172A" />
    <text x="30" y="88" fill="#FBBF24" font-size="9" font-weight="600">⚙️ High-Throughput I/O Loop</text>
  </g>

  <!-- ============================================================ -->
  <!-- ROW 2 (Y: 145)                                              -->
  <!-- ============================================================ -->

  <!-- CARD 5: WebRTC (X: 20, Y: 145) -->
  <g transform="translate(20, 145)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="215" height="110" rx="10" fill="url(#card-grad)" stroke="url(#b-webrtc)" stroke-width="1.2" />
    <circle cx="36" cy="40" r="16" fill="#F43F5E" fill-opacity="0.1" />
    <!-- Official WebRTC Logo Vector -->
