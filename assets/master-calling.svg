<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <marker id="call-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="call-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EC4899" />
    </marker>
  </defs>

  <rect width="1200" height="280" fill="#080B14" />

  <!-- PLANE 1: SIGNALING PLANE -->
  <g transform="translate(30, 20)" font-family="'Inter', sans-serif">
    <rect width="1140" height="110" rx="8" fill="#081824" stroke="#0284C7" stroke-width="1.2" />
    <text x="16" y="20" fill="#67E8F9" font-size="11" font-weight="800" letter-spacing="0.5">SIGNALING PLANE — Socket.IO Server Relay (SDP Offer / Answer &amp; ICE Candidate Exchange)</text>

    <g transform="translate(16, 32)">
      <!-- Client A (Caller) -->
      <rect x="0" y="0" width="280" height="60" rx="5" fill="#0C2538" stroke="#06B6D4" stroke-width="1" />
      <text x="14" y="22" fill="#FFFFFF" font-size="12" font-weight="700">Client A (Caller)</text>
      <text x="14" y="40" fill="#7DD3FC" font-size="10">• Creates SDP Offer with Local Media Tracks</text>
      <text x="14" y="54" fill="#64748B" font-size="9">• Gathers Local ICE Candidates</text>

      <!-- Signaling Connectors -->
      <path d="M 280 30 L 415 30" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#call-cyan)" marker-start="url(#call-cyan)" />
      <rect x="295" y="18" width="105" height="22" rx="3" fill="#080B14" stroke="#0284C7" stroke-width="0.8" />
      <text x="303" y="33" fill="#67E8F9" font-size="8.5" font-weight="700">1. SDP / ICE Relay</text>

      <!-- Signaling Bridge -->
      <rect x="420" y="0" width="280" height="60" rx="5" fill="#0C2538" stroke="#06B6D4" stroke-width="1" />
      <text x="14" y="22" fill="#FFFFFF" font-size="12" font-weight="700">Socket.IO Signaling Bridge</text>
      <text x="14" y="40" fill="#7DD3FC" font-size="10">• Express Server WebSocket Bridge</text>
      <text x="14" y="54" fill="#64748B" font-size="9">• Resolves Target User &amp; Forwards Payloads</text>

      <path d="M 700 30 L 835 30" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#call-cyan)" marker-start="url(#call-cyan)" />
      <rect x="715" y="18" width="105" height="22" rx="3" fill="#080B14" stroke="#0284C7" stroke-width="0.8" />
      <text x="723" y="33" fill="#67E8F9" font-size="8.5" font-weight="700">2. SDP / ICE Relay</text>

      <!-- Client B (Callee) -->
      <rect x="840" y="0" width="268" height="60" rx="5" fill="#0C2538" stroke="#06B6D4" stroke-width="1" />
      <text x="14" y="22" fill="#FFFFFF" font-size="12" font-weight="700">Client B (Callee)</text>
      <text x="14" y="40" fill="#7DD3FC" font-size="10">• Receives Offer &amp; Returns SDP Answer</text>
      <text x="14" y="54" fill="#64748B" font-size="9">• Performs Symmetric ICE Handshake</text>
    </g>
  </g>

  <!-- PLANE 2: MEDIA PLANE -->
  <g transform="translate(30, 145)" font-family="'Inter', sans-serif">
    <rect width="1140" height="115" rx="8" fill="#1C091A" stroke="#BE185D" stroke-width="1.2" />
    <text x="16" y="20" fill="#F472B6" font-size="11" font-weight="800" letter-spacing="0.5">MEDIA PLANE — Direct Peer-to-Peer WebRTC (Full-Duplex SRTP Audio &amp; Video Stream)</text>

    <g transform="translate(16, 32)">
      <!-- Client A Media Engine -->
      <rect x="0" y="0" width="340" height="64" rx="5" fill="#2E0C28" stroke="#EC4899" stroke-width="1" />
      <text x="14" y="22" fill="#FFFFFF" font-size="12" font-weight="700">Client A Media Engine (Browser)</text>
      <text x="14" y="40" fill="#FBCFE8" font-size="10">• Hardware Camera &amp; Mic Capture (getUserMedia)</text>
      <text x="14" y="54" fill="#94A3B8" font-size="9">• VP8/H.264 Video Encoder &amp; Opus Audio Codec</text>

      <!-- P2P SRTP Pipe -->
      <path d="M 340 32 L 760 32" stroke="#EC4899" stroke-width="3" marker-end="url(#call-pink)" marker-start="url(#call-pink)" />
      <rect x="420" y="16" width="260" height="32" rx="4" fill="#080B14" stroke="#BE185D" stroke-width="1" />
      <text x="435" y="32" fill="#F472B6" font-size="10" font-weight="800">DIRECT PEER-TO-PEER MEDIA CHANNEL</text>
      <text x="450" y="43" fill="#FBCFE8" font-size="8.5">Encrypted SRTP (Zero Server Relay Overhead)</text>

      <!-- Client B Media Engine -->
      <rect x="768" y="0" width="340" height="64" rx="5" fill="#2E0C28" stroke="#EC4899" stroke-width="1" />
      <text x="14" y="22" fill="#FFFFFF" font-size="12" font-weight="700">Client B Media Engine (Browser)</text>
      <text x="14" y="40" fill="#FBCFE8" font-size="10">• Direct SRTP Decryption &amp; Hardware Rendering</text>
      <text x="14" y="54" fill="#94A3B8" font-size="9">• Sub-100ms Glass-to-Glass Latency Pipeline</text>
    </g>
  </g>
</svg>